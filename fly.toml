# Fly.io deployment configuration.
#
# The image is built, signed, and pushed by .github/workflows/deploy.yml; this
# file describes only how it runs. `flyctl deploy --image <digest>` supplies the
# artifact, so nothing is ever built from source on the deploy host.

app = 'dice-game-service'
primary_region = 'iad'

# ---------------------------------------------------------------------------
# Shutdown behaviour.
#
# Fly's default kill signal is SIGINT with a 5s timeout. Both defaults are wrong
# for this service: SIGTERM is the conventional drain signal, and the app's own
# drain budget is SHUTDOWN_TIMEOUT_MS (10s). A 5s platform timeout would SIGKILL
# the process mid-drain and drop in-flight requests — exactly the failure the
# graceful shutdown in src/server.ts exists to prevent.
#
# kill_timeout must therefore exceed SHUTDOWN_TIMEOUT_MS. 15s > 10s.
# ---------------------------------------------------------------------------
kill_signal = 'SIGTERM'
kill_timeout = '15s'

[env]
  NODE_ENV = 'production'
  PORT = '3000'
  HOST = '0.0.0.0'
  LOG_LEVEL = 'info'
  # Must stay false: Fly ships stdout to its log pipeline, which wants NDJSON.
  LOG_PRETTY = 'false'
  # Fly terminates TLS and forwards one proxy hop. Without this the rate limiter
  # keys every request to the proxy's address instead of the client's.
  TRUST_PROXY_HOPS = '1'
  SHUTDOWN_TIMEOUT_MS = '10000'

[http_service]
  internal_port = 3000
  force_https = true
  processes = ['app']

  # ---------------------------------------------------------------------------
  # State is in-memory (ADR-0001), so the machine must not be stopped between
  # requests — an auto-stop would silently discard every in-progress game.
  # `min_machines_running = 1` with auto-stop disabled keeps exactly one live
  # instance, which is also the single-replica constraint ADR-0001 requires.
  #
  # Do NOT `fly scale count > 1` until the repository is swapped for a shared
  # store: two machines would hold disjoint game sets, and a client's second
  # request could land on the one that has never heard of their game.
  # ---------------------------------------------------------------------------
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  # Readiness. Fly stops routing to a machine whose check fails, which is what
  # makes the SIGTERM drain in src/server.ts lossless: /readyz flips to 503
  # first, the proxy drains this instance, then the server stops accepting.
  [[http_service.checks]]
    grace_period = '10s'
    interval = '10s'
    timeout = '3s'
    method = 'GET'
    path = '/readyz'

# Liveness. Deliberately a separate, less frequent check against an endpoint
# with no downstream dependencies — a wedged process should be replaced, but a
# busy one should not (see ADR-0006).
[checks]
  [checks.liveness]
    type = 'http'
    grace_period = '15s'
    interval = '30s'
    timeout = '3s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpus = 1

# NODE_OPTIONS in the Dockerfile caps V8's heap at 384 MB, comfortably under the
# 512 MB machine limit. Raising `memory` here without raising that cap leaves
# the extra memory unused; lowering it below ~448 MB risks an OOM kill.
