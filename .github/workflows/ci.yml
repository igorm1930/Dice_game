name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# A new push to the same branch makes the in-flight run obsolete. Cancelling it
# frees runners and gets feedback to the developer faster.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  # Static analysis and unit tests share one install, and turbo already runs the
  # per-package tasks in parallel — splitting them into separate jobs would cost
  # more in setup than it saves.
  verify:
    name: Format, lint, typecheck & test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  # The domain-purity lint rule is the mechanism the whole architecture rests on:
  # it is what stops a Mongoose import landing in the domain layer. A rule that
  # is configured but never proven to fire is worth nothing — the previous
  # generation of this repository had exactly such a check, comparing imports
  # against a denylist that did not contain the frameworks it was meant to
  # exclude, so it passed while proving nothing.
  #
  # This job writes a deliberately illegal file and asserts the linter rejects
  # it. If someone drops `domainPurity` from the shared config, this goes red.
  guard:
    name: Prove the domain-purity guard fires
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: A forbidden import in the domain must fail the lint
        working-directory: apps/api
        run: |
          set -euo pipefail
          cat > src/domain/__guard-probe.ts <<'PROBE'
          import mongoose from 'mongoose';
          import { Injectable } from '@nestjs/common';
          import { randomInt } from 'node:crypto';

          export const leak = { mongoose, Injectable, randomInt, r: Math.random(), t: Date.now() };
          PROBE

          if pnpm exec eslint src/domain/__guard-probe.ts; then
            echo "::error::The domain-purity rule did NOT reject a file importing mongoose, @nestjs/common and node:crypto."
            rm -f src/domain/__guard-probe.ts
            exit 1
          fi

          echo "Guard fired as expected."
          rm -f src/domain/__guard-probe.ts

      - name: The probe must not survive the job
        run: test ! -f apps/api/src/domain/__guard-probe.ts

  # The unit suite runs against hand-written fakes, which is what keeps it fast
  # and installable-with-nothing — and also what stops it from saying anything
  # about the persistence adapters. This job is the other half: the API against
  # a real mongod, pinned to the same `mongo:7.0` a contributor gets from
  # compose.yaml, so CI and a laptop cannot disagree about server behaviour.
  #
  # It deliberately does not `needs: verify`. Chaining it would delay the
  # slowest signal in the pipeline behind the fastest one, and keeping it
  # independent means a formatting failure cannot hide a broken adapter.
  #
  # Note the current state honestly: `test:integration` still carries
  # `--passWithNoTests` and the suite is being written, so today this job is
  # green on nothing. The wiring is what is being landed here; that flag should
  # come out with the first spec, because a permanently empty-but-green job is
  # exactly the failure the comment at the foot of this file warns about.
  integration:
    name: API integration tests against MongoDB
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      # GitHub publishes a service container's port into the job's own network
      # namespace, so the connection string below is the one a contributor
      # already uses locally — there is no host-name indirection to get wrong.
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        # mongod accepts TCP connections slightly before it will answer
        # commands. Without a health check the first test would race the
        # database and fail intermittently, which is the worst failure mode a
        # gate can have — it trains people to re-run until green. GitHub holds
        # every step in this job until the container reports healthy, so the
        # race is prevented rather than retried around.
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 20s

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The suite is invoked through a pnpm filter rather than turbo, so turbo's
      # `test:integration -> ^build` edge never applies. The API consumes
      # `@dice-game/contracts` through that package's built `dist`, so it has to
      # exist before the first import or every spec dies at collection time with
      # a resolution error that looks nothing like its cause. `^...` selects the
      # API's workspace dependencies without rebuilding the API itself.
      - name: Build the API's workspace dependencies
        run: pnpm --filter '@dice-game/api^...' run build

      # There is no seed step here, deliberately. `pnpm db:seed` plants two demo
      # players for a human to log in as; an integration test that leans on them
      # asserts against fixtures it did not create, and then passes or fails for
      # reasons that live in another file. Each spec builds what it needs and
      # owns its own cleanup.
      - name: Integration tests
        env:
          # 127.0.0.1 rather than `localhost`: the published port is IPv4-only,
          # and a resolver that answers ::1 first turns this into a connection
          # refused that reads as a broken database.
          MONGODB_URI: mongodb://127.0.0.1:27017/dice-game
        run: pnpm --filter @dice-game/api run test:integration

  dependencies:
    name: Dependency scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Advisories only for what actually ships. A dev-only advisory should not
      # block a merge, and treating it as if it did trains people to ignore the
      # gate entirely.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

  # Runs only on pull requests — the action has no baseline to diff against on a
  # plain push.
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
# Still to come, with the phases that produce them:
#   - frontend component tests (Phase 5)
#   - Docker build validation for apps/api and apps/web (Phase 6)
#   - Playwright smoke test of the two-user flow with deterministic dice (Phase 7)
# These are deliberately absent rather than stubbed: a job that passes because it
# has nothing to run is worse than a missing one, because it reads as coverage.
