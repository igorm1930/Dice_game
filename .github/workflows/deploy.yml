name: Deploy

on:
  push:
    branches: [main]
  # Manual trigger for re-deploying a known-good SHA without an empty commit —
  # the fastest rollback path there is.
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Existing image tag to deploy (leave blank to build from HEAD)'
        required: false
        type: string

# Serialised, never cancelled: aborting a half-finished deploy leaves the
# environment in an unknown state. `cancel-in-progress` is correct for CI and
# actively dangerous here.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  # Required for keyless signing via Sigstore.
  id-token: write

env:
  REGISTRY: ghcr.io
  NODE_VERSION: '22'
  # The image name is deliberately NOT defined here. `github.repository`
  # preserves the repository's casing, and an OCI reference must be lowercase —
  # a raw env var invites exactly that bug. It is derived once, lowercased, in
  # the "Normalise image name" step below.

jobs:
  # The same gate as CI. A tag reaching the registry without passing this is a
  # tag nobody can vouch for.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: inputs.image_tag == ''

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:ci

  build-and-push:
    name: Build & publish image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    if: always() && (needs.verify.result == 'success' || inputs.image_tag != '')

    outputs:
      image: ${{ steps.resolve.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # The workflow-scoped token — no long-lived registry credential is
          # stored in repository secrets.
          password: ${{ secrets.GITHUB_TOKEN }}

      # OCI image references must be lowercase, but `github.repository` preserves
      # the repository's actual casing. docker/metadata-action lowercases
      # internally, so its tags are valid — anything that builds a reference by
      # hand (cosign, the digest we hand to the deploy job) must lowercase it
      # explicitly or the reference is rejected as unparseable.
      - name: Normalise image name
        id: image
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
          build-args: |
            APP_VERSION=${{ github.sha }}
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}

      # Deploy by immutable digest, never by a mutable tag. `:latest` can point
      # somewhere new between the decision to deploy and the rollout; a digest
      # cannot. This is what makes a rollback exact rather than approximate.
      - name: Resolve image reference
        id: resolve
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            echo "image=${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "image=${{ env.REGISTRY }}/${{ steps.image.outputs.name }}@${{ steps.push.outputs.digest }}" >> "$GITHUB_OUTPUT"
          fi

      # Only a freshly built image has a digest to sign. Re-deploying an
      # existing tag skips this — that image was signed when it was built.
      - name: Install cosign
        if: inputs.image_tag == ''
        uses: sigstore/cosign-installer@v3

      - name: Sign the image
        if: inputs.image_tag == ''
        run: cosign sign --yes "${{ env.REGISTRY }}/${{ steps.image.outputs.name }}@${{ steps.push.outputs.digest }}"

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-and-push

    # A GitHub Environment supplies the deployment secrets and can require a
    # manual approval before this job starts. It is also what records the
    # deployment history against the repository.
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      # ---------------------------------------------------------------------
      # Rollout.
      #
      # Deploys the exact image built and signed above, addressed by immutable
      # digest — nothing is rebuilt on the deploy host, so what ships is
      # bit-identical to what CI verified.
      #
      # `--strategy rolling` waits on the readiness check declared in fly.toml
      # before considering the machine healthy. Combined with the SIGTERM drain
      # in src/server.ts (readiness fails first, then the server stops
      # accepting), that is what makes the cutover lossless.
      #
      # Note: with a single machine — required while state is in-memory, see
      # ADR-0001 — a rolling deploy still has a brief gap while the replacement
      # comes up, and in-progress games are lost. That is an accepted, recorded
      # consequence of the persistence decision, not an oversight. Swapping the
      # repository for a shared store removes both limitations.
      #
      # Other targets, should this move: `kubectl set image ... && kubectl
      # rollout status`, or `aws ecs update-service --force-new-deployment`.
      # ---------------------------------------------------------------------
      - name: Roll out
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${FLY_API_TOKEN:-}" ]; then
            echo "::error::FLY_API_TOKEN is not set on the 'production' environment."
            echo "Create it with: fly tokens create deploy -a dice-game-service"
            exit 1
          fi

          echo "Deploying image: ${{ needs.build-and-push.outputs.image }}"

          flyctl deploy \
            --image "${{ needs.build-and-push.outputs.image }}" \
            --strategy rolling \
            --wait-timeout 300 \
            --verbose

      # A readiness poll only proves the process booted. This plays a real game
      # against production so the deploy is verified end to end, and fails the
      # job — surfacing the rollback instruction below — if it does not.
      - name: Post-deploy smoke test
        if: vars.PRODUCTION_URL != ''
        env:
          BASE_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          set -euo pipefail

          # Wait for STABLE readiness, not a single 200.
          #
          # During a rolling deploy the old machine and the new one both exist
          # briefly. A single successful probe can hit the outgoing machine
          # moments before it is destroyed, after which the next request lands on
          # a proxy still switching backends — which is exactly how this step
          # produced a false failure: readiness passed, then the very next call
          # failed 0.44s later while the app itself was perfectly healthy.
          #
          # With a single replica (required while state is in-memory, ADR-0001)
          # that window is unavoidable, so verification has to ride it out rather
          # than pretend it does not exist. Requiring consecutive successes means
          # the edge has settled on one backend before we assert anything.
          REQUIRED_STREAK=3
          streak=0

          echo "Waiting for ${BASE_URL} to report ready ${REQUIRED_STREAK}x consecutively..."
          for i in $(seq 1 40); do
            if curl -sf --max-time 10 "${BASE_URL}/readyz" > /dev/null 2>&1; then
              streak=$((streak + 1))
              if [ "$streak" -ge "$REQUIRED_STREAK" ]; then
                echo "Stable after ${i} probe(s)."
                break
              fi
            else
              # Any failure resets the streak — a flap means it is not settled.
              streak=0
            fi

            if [ "$i" -eq 40 ]; then
              echo "::error::Service never reported ready ${REQUIRED_STREAK}x in a row within 200s."
              exit 1
            fi
            sleep 5
          done

          # Issues a request and fails loudly WITH the status and body.
          #
          # `curl -sf` was used here originally and was a mistake: it collapses
          # every failure into exit code 22, discarding the response. A gate that
          # fires without saying why costs more time than it saves — the service
          # returns a structured error envelope with a code and a requestId, and
          # that is exactly what an operator needs to see.
          request() {
            local method="$1" path="$2" expected="$3" data="${4:-}"
            local response http_code body attempt

            # 5xx and connection failures during the cutover window are the
            # platform switching backends, not the application misbehaving, so
            # they are retried. A 4xx is never retried — that is the application
            # giving a definitive answer, and retrying would only hide it.
            for attempt in 1 2 3 4 5; do
              if [ -n "$data" ]; then
                response=$(curl -sS --max-time 15 -X "$method" "${BASE_URL}${path}" \
                  -H 'Content-Type: application/json' \
                  -d "$data" -w '\n%{http_code}' 2>/dev/null) || response=$'\n000'
              else
                response=$(curl -sS --max-time 15 -X "$method" "${BASE_URL}${path}" \
                  -w '\n%{http_code}' 2>/dev/null) || response=$'\n000'
              fi

              http_code=$(printf '%s' "$response" | tail -n1)
              body=$(printf '%s' "$response" | sed '$d')

              case "$http_code" in
                "$expected") break ;;
                5*|000)
                  if [ "$attempt" -lt 5 ]; then
                    echo "Transient ${http_code} on ${method} ${path}; retrying (${attempt}/5)..." >&2
                    sleep 4
                    continue
                  fi
                  ;;
                *) break ;;
              esac
            done

            # Diagnostics go to stderr, never stdout. The caller captures stdout
            # via $(...), so anything echoed there is swallowed into a variable
            # instead of reaching the log — which would silently recreate the
            # very blindness this function exists to remove.
            if [ "$http_code" != "$expected" ]; then
              {
                echo "::error::${method} ${path} returned HTTP ${http_code}, expected ${expected}."
                echo "Response body:"
                echo "$body"
              } >&2
              return 1
            fi

            printf '%s' "$body"
          }

          # The full game flow as one verifiable unit.
          #
          # Every `request` gets an explicit `|| return 1`: called inside an
          # `if` condition, bash suppresses `set -e` for the whole function
          # body, so without these a failed step would silently fall through.
          run_flow() {
            local created game_id status refused refused_code round

            created=$(request POST /api/v1/games 201 \
              '{"playerName":"Deploy Smoke Test","rounds":3}') || return 1
            game_id=$(printf '%s' "$created" | jq -r '.data.id')

            if [ -z "$game_id" ] || [ "$game_id" = "null" ]; then
              echo "::error::Created a game but could not read its id from the response." >&2
              echo "$created" >&2
              return 1
            fi
            echo "Created game ${game_id}."

            for round in 1 2 3; do
              request POST "/api/v1/games/${game_id}/rolls" 201 > /dev/null || return 1
              echo "Played round ${round}."
            done

            status=$(request GET "/api/v1/games/${game_id}" 200 | jq -r '.data.status') || return 1
            if [ "$status" != "COMPLETED" ]; then
              echo "::error::Expected COMPLETED after 3 rounds, got ${status}." >&2
              return 1
            fi

            # The 4th roll must be refused — proves domain rules survived the
            # deploy. `request` expects 409, so a 201 (rules lost) fails loudly.
            refused=$(request POST "/api/v1/games/${game_id}/rolls" 409) || return 1
            refused_code=$(printf '%s' "$refused" | jq -r '.error.code')
            if [ "$refused_code" != "GAME_ALREADY_COMPLETED" ]; then
              echo "::error::Expected GAME_ALREADY_COMPLETED, got ${refused_code}." >&2
              return 1
            fi
          }

          # The flow retries as a WHOLE, not per request. Run #5 showed why:
          # a game was created (201) and vanished 180ms later (404) — the two
          # requests straddled the outgoing and incoming machines during the
          # cutover overlap, each holding disjoint in-memory state (the
          # documented cost of ADR-0001). No single-request retry can fix a
          # flow split across two backends, and retrying a 404 would mask real
          # bugs. Instead the whole sequence gets fresh, loudly-diagnosed
          # attempts; once the old machine is reaped (seconds), a clean run
          # verifies the steady state. Three straight full-flow failures is a
          # real defect and fails the deploy.
          for flow_attempt in 1 2 3; do
            echo "--- smoke flow attempt ${flow_attempt}/3 ---"
            if run_flow; then
              echo "Production smoke test passed."
              exit 0
            fi
            if [ "$flow_attempt" -lt 3 ]; then
              echo "Flow attempt ${flow_attempt} failed — expected during the brief post-cutover instance overlap; retrying in 20s..."
              sleep 20
            fi
          done

          echo "::error::Smoke test failed on 3 consecutive full-flow attempts — this is a real defect, not cutover noise."
          exit 1

      # A deploy that cannot prove it succeeded should not be recorded as one.
      - name: Report outcome
        if: always()
        run: |
          echo "### Deployment ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`${{ needs.build-and-push.outputs.image }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Rollback: re-run this workflow with \`image_tag\` set to the previous good SHA." >> "$GITHUB_STEP_SUMMARY"
