name: Deploy

on:
  push:
    branches: [main]
  # Manual trigger for re-deploying a known-good SHA without an empty commit —
  # the fastest rollback path there is.
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Existing image tag to deploy (leave blank to build from HEAD)'
        required: false
        type: string

# Serialised, never cancelled: aborting a half-finished deploy leaves the
# environment in an unknown state. `cancel-in-progress` is correct for CI and
# actively dangerous here.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  # Required for keyless signing via Sigstore.
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  NODE_VERSION: '22'

jobs:
  # The same gate as CI. A tag reaching the registry without passing this is a
  # tag nobody can vouch for.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: inputs.image_tag == ''

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:ci

  build-and-push:
    name: Build & publish image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    if: always() && (needs.verify.result == 'success' || inputs.image_tag != '')

    outputs:
      image: ${{ steps.resolve.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # The workflow-scoped token — no long-lived registry credential is
          # stored in repository secrets.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
          build-args: |
            APP_VERSION=${{ github.sha }}
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}

      # Deploy by immutable digest, never by a mutable tag. `:latest` can point
      # somewhere new between the decision to deploy and the rollout; a digest
      # cannot. This is what makes a rollback exact rather than approximate.
      - name: Resolve image reference
        id: resolve
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            echo "image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}" >> "$GITHUB_OUTPUT"
          fi

      # Only a freshly built image has a digest to sign. Re-deploying an
      # existing tag skips this — that image was signed when it was built.
      - name: Install cosign
        if: inputs.image_tag == ''
        uses: sigstore/cosign-installer@v3

      - name: Sign the image
        if: inputs.image_tag == ''
        run: cosign sign --yes "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}"

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-and-push

    # A GitHub Environment supplies the deployment secrets and can require a
    # manual approval before this job starts. It is also what records the
    # deployment history against the repository.
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      # ---------------------------------------------------------------------
      # Rollout.
      #
      # Deploys the exact image built and signed above, addressed by immutable
      # digest — nothing is rebuilt on the deploy host, so what ships is
      # bit-identical to what CI verified.
      #
      # `--strategy rolling` waits on the readiness check declared in fly.toml
      # before considering the machine healthy. Combined with the SIGTERM drain
      # in src/server.ts (readiness fails first, then the server stops
      # accepting), that is what makes the cutover lossless.
      #
      # Note: with a single machine — required while state is in-memory, see
      # ADR-0001 — a rolling deploy still has a brief gap while the replacement
      # comes up, and in-progress games are lost. That is an accepted, recorded
      # consequence of the persistence decision, not an oversight. Swapping the
      # repository for a shared store removes both limitations.
      #
      # Other targets, should this move: `kubectl set image ... && kubectl
      # rollout status`, or `aws ecs update-service --force-new-deployment`.
      # ---------------------------------------------------------------------
      - name: Roll out
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${FLY_API_TOKEN:-}" ]; then
            echo "::error::FLY_API_TOKEN is not set on the 'production' environment."
            echo "Create it with: fly tokens create deploy -a dice-game-service"
            exit 1
          fi

          echo "Deploying image: ${{ needs.build-and-push.outputs.image }}"

          flyctl deploy \
            --image "${{ needs.build-and-push.outputs.image }}" \
            --strategy rolling \
            --wait-timeout 300 \
            --verbose

      # A readiness poll only proves the process booted. This plays a real game
      # against production so the deploy is verified end to end, and fails the
      # job — surfacing the rollback instruction below — if it does not.
      - name: Post-deploy smoke test
        if: vars.PRODUCTION_URL != ''
        env:
          BASE_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          set -euo pipefail

          echo "Waiting for ${BASE_URL} to report ready..."
          for i in $(seq 1 30); do
            if curl -sf "${BASE_URL}/readyz" > /dev/null; then
              echo "Ready after ${i} attempt(s)."
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "::error::Service did not become ready within 150s."
              exit 1
            fi
            sleep 5
          done

          echo "Playing a full game against production..."
          GAME_ID=$(curl -sf -X POST "${BASE_URL}/api/v1/games" \
            -H 'Content-Type: application/json' \
            -d '{"playerName":"Deploy Smoke Test","rounds":3}' \
            | jq -r '.data.id')

          if [ -z "$GAME_ID" ] || [ "$GAME_ID" = "null" ]; then
            echo "::error::Failed to create a game."
            exit 1
          fi

          for _ in 1 2 3; do
            curl -sf -X POST "${BASE_URL}/api/v1/games/${GAME_ID}/rolls" > /dev/null
          done

          STATUS=$(curl -sf "${BASE_URL}/api/v1/games/${GAME_ID}" | jq -r '.data.status')
          if [ "$STATUS" != "COMPLETED" ]; then
            echo "::error::Expected COMPLETED after 3 rounds, got ${STATUS}."
            exit 1
          fi

          # The 4th roll must be refused — proves domain rules survived the deploy.
          CODE=$(curl -s -o /dev/null -w '%{http_code}' \
            -X POST "${BASE_URL}/api/v1/games/${GAME_ID}/rolls")
          if [ "$CODE" != "409" ]; then
            echo "::error::Expected 409 on a completed game, got ${CODE}."
            exit 1
          fi

          echo "Production smoke test passed."

      # A deploy that cannot prove it succeeded should not be recorded as one.
      - name: Report outcome
        if: always()
        run: |
          echo "### Deployment ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`${{ needs.build-and-push.outputs.image }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Rollback: re-run this workflow with \`image_tag\` set to the previous good SHA." >> "$GITHUB_STEP_SUMMARY"
