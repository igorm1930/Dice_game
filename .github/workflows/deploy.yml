name: Deploy

on:
  push:
    branches: [main]
  # Manual trigger for re-deploying a known-good SHA without an empty commit —
  # the fastest rollback path there is.
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Existing image tag to deploy (leave blank to build from HEAD)'
        required: false
        type: string

# Serialised, never cancelled: aborting a half-finished deploy leaves the
# environment in an unknown state. `cancel-in-progress` is correct for CI and
# actively dangerous here.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  # Required for keyless signing via Sigstore.
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  NODE_VERSION: '22'

jobs:
  # The same gate as CI. A tag reaching the registry without passing this is a
  # tag nobody can vouch for.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: inputs.image_tag == ''

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:ci

  build-and-push:
    name: Build & publish image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    if: always() && (needs.verify.result == 'success' || inputs.image_tag != '')

    outputs:
      image: ${{ steps.resolve.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # The workflow-scoped token — no long-lived registry credential is
          # stored in repository secrets.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
          build-args: |
            APP_VERSION=${{ github.sha }}
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}

      # Deploy by immutable digest, never by a mutable tag. `:latest` can point
      # somewhere new between the decision to deploy and the rollout; a digest
      # cannot. This is what makes a rollback exact rather than approximate.
      - name: Resolve image reference
        id: resolve
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            echo "image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}" >> "$GITHUB_OUTPUT"
          fi

      # Only a freshly built image has a digest to sign. Re-deploying an
      # existing tag skips this — that image was signed when it was built.
      - name: Install cosign
        if: inputs.image_tag == ''
        uses: sigstore/cosign-installer@v3

      - name: Sign the image
        if: inputs.image_tag == ''
        run: cosign sign --yes "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}"

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-and-push

    # A GitHub Environment supplies the deployment secrets and can require a
    # manual approval before this job starts. It is also what records the
    # deployment history against the repository.
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}

    steps:
      - uses: actions/checkout@v4

      # ---------------------------------------------------------------------
      # Target-specific rollout.
      #
      # Left as an explicit placeholder rather than a guess: the correct command
      # depends on infrastructure not specified by this assignment. Each option
      # below is a drop-in replacement.
      #
      #   Kubernetes:
      #     kubectl set image deployment/dice-game-service \
      #       api=${{ needs.build-and-push.outputs.image }} -n production
      #     kubectl rollout status deployment/dice-game-service -n production --timeout=5m
      #
      #   AWS ECS:
      #     aws ecs update-service --cluster prod --service dice-game \
      #       --force-new-deployment --task-definition "$TASK_DEF"
      #
      #   Fly.io:
      #     flyctl deploy --image ${{ needs.build-and-push.outputs.image }}
      #
      # Whichever is used, the rollout must be a *rolling* one that waits on the
      # readiness probe. The app's SIGTERM drain (see server.ts) is what makes
      # that lossless: readiness fails first, the load balancer stops routing,
      # then in-flight requests finish before the process exits.
      # ---------------------------------------------------------------------
      - name: Roll out
        run: |
          echo "Deploying image: ${{ needs.build-and-push.outputs.image }}"
          echo "::warning::No deployment target configured — wire up the rollout command in deploy.yml."

      - name: Post-deploy smoke test
        if: vars.PRODUCTION_URL != ''
        run: |
          set -euo pipefail
          echo "Verifying ${{ vars.PRODUCTION_URL }} is serving..."

          for i in $(seq 1 30); do
            if curl -sf "${{ vars.PRODUCTION_URL }}/readyz" > /dev/null; then
              echo "Service is ready."
              exit 0
            fi
            sleep 5
          done

          echo "Service did not become ready after deploy."
          exit 1

      # A deploy that cannot prove it succeeded should not be recorded as one.
      - name: Report outcome
        if: always()
        run: |
          echo "### Deployment ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`${{ needs.build-and-push.outputs.image }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Rollback: re-run this workflow with \`image_tag\` set to the previous good SHA." >> "$GITHUB_STEP_SUMMARY"
