openapi: 3.1.0

info:
  title: Dice Game Service
  version: 1.0.0
  description: |
    Production-ready dice game backend.

    Every response — success or failure — carries `meta.requestId`, which
    correlates to every log line emitted while handling that request. Quote it
    when reporting a problem.

    Clients should branch on the stable `error.code` string, never on
    `error.message`, which is free to change.
  license:
    name: MIT

servers:
  - url: http://localhost:3000
    description: Local development

tags:
  - name: Auth
    description: Registration, login, and the bearer credential every game action needs
  - name: Pig Game
    description: The two-player Pig game — the backend is the sole rule and turn authority
  - name: Games
    description: Create games and play rounds
  - name: Leaderboard
  - name: Health
    description: Infrastructure probes (unversioned, never rate limited)

paths:
  /api/v1/games:
    post:
      tags: [Games]
      summary: Create a game
      operationId: createGame
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGameRequest'
      responses:
        '201':
          description: Created
          headers:
            Location:
              schema: { type: string }
              description: URI of the created game
            x-request-id:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameEnvelope'
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

    get:
      tags: [Games]
      summary: List games, newest first
      operationId: listGames
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: A page of games
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [items, pagination]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Game' }
                      pagination:
                        $ref: '#/components/schemas/Pagination'
                  meta: { $ref: '#/components/schemas/Meta' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/games/{gameId}:
    get:
      tags: [Games]
      summary: Fetch a game
      operationId: getGame
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: The game
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GameEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/games/{gameId}/rolls:
    post:
      tags: [Games]
      summary: Play a round
      operationId: rollDice
      description: |
        Rolls two dice, scores the round, and appends it to the game.

        The game auto-completes when its final round is played — there is no
        separate "finish" call. Rolling a completed game returns 409.

        Concurrent rolls against the same game are serialised, so no round is
        ever lost.
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '201':
          description: The round played, plus the updated game
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [round, game]
                    properties:
                      round: { $ref: '#/components/schemas/Round' }
                      game: { $ref: '#/components/schemas/Game' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            The game has already played all its rounds
            (`GAME_ALREADY_COMPLETED`), or the write lost an optimistic
            concurrency check (`CONCURRENCY_CONFLICT` — re-read and retry).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/leaderboard:
    get:
      tags: [Leaderboard]
      summary: Top completed games by score
      operationId: getLeaderboard
      description: |
        Only completed games appear. Ties are broken by earliest completion, so
        ordering is stable across calls.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        '200':
          description: Ranked entries
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/LeaderboardEntry' }
                  meta: { $ref: '#/components/schemas/Meta' }

  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Register a player
      operationId: register
      description: |
        Creates a player and returns a bearer token in the same response, so a
        new player is immediately able to play. Passwords are hashed with scrypt
        and never echoed (ADR-0007).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '201':
          description: Player created and signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: Username already registered (`USERNAME_TAKEN`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Exchange credentials for a token
      operationId: login
      description: |
        A wrong password and an unknown username return an identical body and
        take the same time — the endpoint is deliberately not an account
        enumeration oracle. Credential endpoints carry their own, much tighter
        rate limit than the gameplay routes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current token
      operationId: logout
      security:
        - bearerAuth: []
      description: |
        Sessions are server-side, so logout is a real revocation rather than a
        client-side forget (ADR-0007).
      responses:
        '204': { description: Token revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Identify the bearer
      operationId: me
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The authenticated player
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/Player' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/pig-game:
    get:
      tags: [Pig Game]
      summary: Current state of the shared Pig game
      operationId: getPigGame
      security:
        - bearerAuth: []
      description: |
        There is exactly one Pig match, shared by every client — the UI is a pure
        renderer of this state. `viewerSeat` tells the caller which seat, if any,
        they occupy.

        Roll and hold accept no request body at all: every in-match rule is
        applied server-side and the actor is the bearer of the credential, so
        there is nothing a client could legitimately send. The only setup input
        is the opponent and the winning score at NEW GAME.
      responses:
        '200':
          description: The shared game state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PigGameEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: No match has been started yet (`PIG_GAME_NOT_FOUND`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /api/v1/pig-game/roll:
    post:
      tags: [Pig Game]
      summary: Throw both dice
      operationId: pigRoll
      security:
        - bearerAuth: []
      description: |
        Throws two dice. **6 & 6** busts — the round score is lost and the turn
        passes. Any other throw adds the sum of both dice to the round score and
        the same player may roll again. A single six is an ordinary six.

        Only the player whose turn it is may roll; anyone else gets a 403.
      responses:
        '200':
          description: Updated game state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PigGameEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No match has been started yet (`PIG_GAME_NOT_FOUND`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '409':
          description: The game has already been won (`PIG_GAME_OVER`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /api/v1/pig-game/hold:
    post:
      tags: [Pig Game]
      summary: Bank the round score
      operationId: pigHold
      security:
        - bearerAuth: []
      description: |
        Adds the round score to the active player's global score. Reaching the
        match's `targetScore` wins immediately and increments that player's win
        counter; otherwise the turn passes. Holding on zero is legal and simply
        forfeits the turn.
      responses:
        '200':
          description: Updated game state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PigGameEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No match has been started yet (`PIG_GAME_NOT_FOUND`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '409':
          description: The game has already been won (`PIG_GAME_OVER`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /api/v1/pig-game/new-game:
    post:
      tags: [Pig Game]
      summary: Start a fresh match
      operationId: pigNewGame
      security:
        - bearerAuth: []
      description: |
        Seats the caller opposite the named opponent, who must be a registered
        player. Any authenticated player may start a new game at any time,
        including while one is in progress.

        The winning score is optional (playable range 2–1000; the server default
        applies when omitted) and is frozen for the match — it cannot be changed
        mid-game.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [opponent]
              properties:
                opponent:
                  type: string
                  description: Username of the registered player to sit opposite.
                  examples: ['bob']
                targetScore:
                  type: integer
                  minimum: 2
                  maximum: 1000
                  description: Global score at which a player wins. Defaults to 100.
      responses:
        '201':
          description: The new match
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PigGameEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: No such opponent (`USER_NOT_FOUND`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '422':
          description: |
            Well-formed but unplayable — an out-of-range winning score
            (`INVALID_TARGET_SCORE`) or a player naming themselves
            (`INVALID_OPPONENT`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /healthz:
    get:
      tags: [Health]
      summary: Liveness probe
      operationId: live
      description: |
        Answers "is this process wedged?" and depends on nothing downstream —
        a dependency outage must never cause a restart storm.
      responses:
        '200':
          description: The process is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, examples: ['ok'] }
                  service: { type: string }
                  version: { type: string }
                  uptimeSeconds: { type: integer }
                  timestamp: { type: string, format: date-time }

  /readyz:
    get:
      tags: [Health]
      summary: Readiness probe
      operationId: ready
      description: |
        Answers "should traffic route here right now?". Returns 503 as soon as
        SIGTERM is received, so the load balancer drains this instance before
        the server stops accepting connections.
      responses:
        '200':
          description: Ready to serve
        '503':
          description: Draining — do not route new traffic

components:
  parameters:
    GameId:
      name: gameId
      in: path
      required: true
      schema: { type: string, format: uuid }

  schemas:
    CreateGameRequest:
      type: object
      required: [playerName]
      additionalProperties: false
      properties:
        playerName:
          type: string
          minLength: 1
          maxLength: 64
          description: Letters, numbers, spaces, dots, underscores and hyphens.
          examples: ['Ada Lovelace']
        rounds:
          type: integer
          minimum: 1
          maximum: 100
          description: |
            Defaults to `GAME_DEFAULT_ROUNDS` (5). Values above the configured
            `GAME_MAX_ROUNDS` (20) are well-formed but domain-invalid → 422.
          examples: [3]

    Game:
      type: object
      required:
        [
          id,
          playerName,
          status,
          totalRounds,
          roundsPlayed,
          roundsRemaining,
          totalScore,
          rounds,
          createdAt,
          completedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        playerName: { type: string }
        status: { type: string, enum: [IN_PROGRESS, COMPLETED] }
        totalRounds: { type: integer }
        roundsPlayed: { type: integer }
        roundsRemaining: { type: integer }
        totalScore: { type: integer }
        rounds:
          type: array
          items: { $ref: '#/components/schemas/Round' }
        createdAt: { type: string, format: date-time }
        completedAt:
          type: [string, 'null']
          format: date-time

    Round:
      type: object
      required: [index, dice, pips, outcome, points, scoreAfter, rolledAt]
      properties:
        index:
          type: integer
          description: 1-based position within the game.
        dice:
          type: array
          minItems: 2
          maxItems: 2
          items: { type: integer, minimum: 1, maximum: 6 }
        pips:
          type: integer
          description: Sum of both dice.
        outcome:
          type: string
          enum: [SNAKE_EYES, DOUBLES, LUCKY_SEVEN, STANDARD]
          description: |
            Evaluated in strict precedence order:
              SNAKE_EYES  (1,1) ....... 0 points, overrides the doubles bonus
              DOUBLES     (n,n) ....... pips x 2
              LUCKY_SEVEN (pips = 7) .. pips + 10
              STANDARD ................ pips
        points: { type: integer, minimum: 0, maximum: 24 }
        scoreAfter:
          type: integer
          description: Running total after this round.
        rolledAt: { type: string, format: date-time }

    LeaderboardEntry:
      type: object
      required: [rank, gameId, playerName, totalScore, totalRounds, completedAt]
      properties:
        rank: { type: integer, minimum: 1 }
        gameId: { type: string, format: uuid }
        playerName: { type: string }
        totalScore: { type: integer }
        totalRounds: { type: integer }
        completedAt:
          type: [string, 'null']
          format: date-time

    Pagination:
      type: object
      required: [total, limit, offset, hasMore]
      properties:
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
        hasMore: { type: boolean }

    Meta:
      type: object
      required: [requestId, timestamp]
      properties:
        requestId:
          type: string
          description: Correlates to every log line for this request.
        timestamp: { type: string, format: date-time }

    Player:
      type: object
      required: [id, username, wins]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        wins:
          type: integer
          minimum: 0
          description: How many games this player has won.

    Credentials:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 24
          pattern: '^[A-Za-z0-9_-]+$'
        password:
          type: string
          minLength: 8
          maxLength: 128

    Session:
      type: object
      required: [player, token]
      properties:
        player: { $ref: '#/components/schemas/Player' }
        token:
          type: string
          description: |
            Opaque bearer credential. Send as `Authorization: Bearer <token>`.

    SessionEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/Session' }
        meta: { $ref: '#/components/schemas/Meta' }

    PigGame:
      type: object
      required:
        [
          players,
          totalScores,
          currentTurnScore,
          activePlayer,
          isPlaying,
          winner,
          lastRoll,
          bustedOnLastRoll,
          targetScore,
          viewerSeat,
        ]
      properties:
        players:
          type: array
          minItems: 2
          maxItems: 2
          items: { $ref: '#/components/schemas/Player' }
          description: The two seated players, index-aligned with `totalScores`.
        totalScores:
          type: array
          minItems: 2
          maxItems: 2
          items: { type: integer, minimum: 0 }
          description: Banked global scores for seat 0 and seat 1.
        currentTurnScore:
          type: integer
          minimum: 0
          description: The active player's unbanked round score.
        activePlayer: { type: integer, enum: [0, 1] }
        isPlaying: { type: boolean }
        winner:
          type: [integer, 'null']
          enum: [0, 1, null]
        lastRoll:
          type: ['array', 'null']
          minItems: 2
          maxItems: 2
          items: { type: integer, minimum: 1, maximum: 6 }
          description: Both faces of the last throw — the client renders, never computes, them.
        bustedOnLastRoll:
          type: boolean
          description: |
            Whether that throw was a double six. Derived server-side so the
            client can show the "round lost" moment without re-deciding what a
            bust is.
        targetScore:
          type: integer
          description: Global score at which a player wins. Frozen for the match.
        viewerSeat:
          type: [integer, 'null']
          enum: [0, 1, null]
          description: Which seat the calling player occupies, or null if watching.

    PigGameEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/PigGame' }
        meta: { $ref: '#/components/schemas/Meta' }

    GameEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/Game' }
        meta: { $ref: '#/components/schemas/Meta' }

    ErrorEnvelope:
      type: object
      required: [error, meta]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable identifier. Branch on this, never on `message`.
              enum:
                - VALIDATION_ERROR
                - MALFORMED_REQUEST_BODY
                - PAYLOAD_TOO_LARGE
                - UNAUTHENTICATED
                - INVALID_CREDENTIALS
                - NOT_A_PARTICIPANT
                - NOT_YOUR_TURN
                - GAME_NOT_FOUND
                - PIG_GAME_NOT_FOUND
                - USER_NOT_FOUND
                - ROUTE_NOT_FOUND
                - GAME_ALREADY_COMPLETED
                - PIG_GAME_OVER
                - USERNAME_TAKEN
                - CONCURRENCY_CONFLICT
                - INVALID_ROUND_COUNT
                - INVALID_TARGET_SCORE
                - INVALID_OPPONENT
                - RATE_LIMIT_EXCEEDED
                - INTERNAL_SERVER_ERROR
            message: { type: string }
            details:
              description: Machine-readable context. Never contains secrets.
        meta: { $ref: '#/components/schemas/Meta' }

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Opaque session token issued by `/auth/register` or `/auth/login`.
        Every game endpoint requires one — identity is never taken from a
        request body (ADR-0007).

  responses:
    Unauthorized:
      description: Missing, malformed, or expired credential
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: |
        Authenticated but not permitted — acting out of turn (`NOT_YOUR_TURN`)
        or not one of the two seated players (`NOT_A_PARTICIPANT`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    BadRequest:
      description: Malformed request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    UnprocessableEntity:
      description: Well-formed but violates a domain rule
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
